<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="same-origin">
<title>CPA 面板</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<a class="skip-link" href="#view">跳到主内容</a>

<noscript>
  <div class="gate"><div class="gate-card"><h1>CPA 面板</h1>
  <p class="muted">此面板需要启用 JavaScript。</p></div></div>
</noscript>

<div id="gate" class="gate" hidden></div>

<div id="booting" class="gate"><div class="gate-card"><h1>CPA 面板</h1><p class="muted">正在加载…</p></div></div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <button id="navToggle" class="icon-btn only-narrow" type="button" aria-label="切换导航" aria-expanded="false" aria-controls="sidebar">☰</button>
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">CPA 面板</span>
      <span id="brandVer" class="muted small"></span>
    </div>
    <div class="topbar-right">
      <label class="node-picker">
        <span class="muted small only-wide">节点</span>
        <select id="nodeSelect" aria-label="选择 CPA 节点"></select>
      </label>
      <button id="btnRefresh" class="btn" type="button" title="重新加载当前页">刷新</button>
      <button id="btnTheme" class="icon-btn" type="button" aria-label="切换主题" title="切换主题">◐</button>
      <button id="btnLogout" class="btn ghost" type="button">退出</button>
    </div>
  </header>

  <div class="shell">
    <nav id="sidebar" class="sidebar" aria-label="主导航">
      <ul id="navList"></ul>
      <div id="navFoot" class="nav-foot muted small"></div>
    </nav>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
<div id="modalRoot" class="modal-root" hidden></div>

<script src="./app.js" defer></script>
</body>
</html>
